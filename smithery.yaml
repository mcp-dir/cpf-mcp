# Smithery configuration for CPF
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_cpf

name: cpf-mcp
displayName: "CPF"
description: >
  Valida CPF (dígitos verificadores) e descobre processos judiciais por CPF, buscando por NOME no Diário (DJEN). Importante: CPF→nome não é dado público; informe o nome do titular (recomendado). Sem credencial.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/cpf-mcp
repository: https://github.com/mcp-dir/cpf-mcp

tags:
  - cpf
  - brazil
  - med
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_cpf

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_cpf/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
